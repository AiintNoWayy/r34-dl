<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>r34-dl</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #293129;
    --panel: #303a30;
    --border: #3c453c;
    --text: #c0c0c0;
    --muted: #878787;
    --accent: #b0e0b0;
    --accent-text: #1a201a;
    --danger: #f0a0a0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Tahoma, "Trebuchet MS", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1rem;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  input[type="text"], input[type="password"], input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.6rem 0.75rem;
    font-size: 1rem;
    width: 100%;
  }
  label.field { display: flex; flex-direction: column; gap: 0.35rem; font-size: 0.85rem; color: var(--muted); }
  .options { display: flex; gap: 1.25rem; flex-wrap: wrap; color: var(--muted); font-size: 0.9rem; }
  .options label { display: flex; align-items: center; gap: 0.4rem; }
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    position: relative;
    cursor: pointer;
    vertical-align: middle;
  }
  input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 4px;
    height: 8px;
    border: solid var(--accent-text);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 0.65rem 1rem;
    font-size: 1rem;
    cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.6; cursor: default; }
  .job-actions { display: flex; gap: 0.75rem; }
  .job-actions button:not(#cancel-btn) { flex: 1; }
  #search-result { font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  #scan-result { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
  #scan-result.error { color: var(--danger); }
  #search-result.error { color: var(--danger); }
  #queue-section { margin-top: 1rem; }
  .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--muted); }
  .queue-header button { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
  #queue-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  #queue-list li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 0.85rem;
  }
  #queue-list li.running { border-color: var(--accent); }
  #queue-list .queue-tag { flex: 1; overflow-wrap: anywhere; }
  #queue-list .queue-count { color: var(--muted); }
  #queue-list .queue-status { color: var(--muted); min-width: 70px; text-align: right; }
  #queue-list li button { padding: 0.2rem 0.55rem; font-size: 0.75rem; }
  .folder-row { display: flex; align-items: center; gap: 0.75rem; color: var(--muted); font-size: 0.85rem; }
  .folder-row span { flex: 1; overflow-wrap: anywhere; }
  #status {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.2em;
  }
  #setup-error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  #find-uploader-form { margin-bottom: 1rem; }
  #uploader-result { font-size: 0.9rem; color: var(--muted); min-height: 1.2em; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  #uploader-result.error { color: var(--danger); }
  #uploader-result strong { color: var(--text); }
  #uploader-result button { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
  #progress-track {
    margin-top: 0.5rem;
    height: 8px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  #progress-track:not(.visible) { display: none; }
  #progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s ease;
  }
  #progress-fill.indeterminate {
    width: 30% !important;
    animation: indeterminate 1.2s infinite ease-in-out;
  }
  @keyframes indeterminate {
    0% { margin-left: 0%; }
    100% { margin-left: 70%; }
  }
  #failures { color: var(--danger); font-size: 0.8rem; margin: 0.5rem 0 0; padding-left: 1.1rem; }
  #failures:empty { display: none; }
  #preview {
    margin-top: 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
  }
  #preview img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  footer { margin-top: 1rem; font-size: 0.8rem; color: var(--muted); }
  footer a { color: var(--accent); }
  #moreOptionsToggle { align-self: flex-start; color: var(--accent); font-size: 0.85rem; text-decoration: none; }
  #moreOptionsToggle:hover { text-decoration: underline; }
  #moreOptions { gap: 0.75rem; }
  #moreOptions:not([hidden]) { display: flex; }
  #moreOptions #excludeTags { flex: 2; }
  #moreOptions #batchLimit { flex: 1; min-width: 0; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] { -moz-appearance: textfield; }
</style>
</head>
<body>
<main>
  <h1>r34-dl</h1>
  <p class="subtitle">Fetch images, videos, and metadata by tag from rule34.xxx's public API.</p>

  <section id="setup-view" hidden>
    <form id="setup-form">
      <label class="field">
        API credentials
        <input type="text" id="credentialsPaste" placeholder="&api_key=...&user_id=..." autocomplete="off" required />
      </label>
      <button type="submit" id="setup-submit">Save & Continue</button>
      <div id="setup-error"></div>
    </form>
    <footer>
      Go to <strong>My Account &rarr; Options &rarr; API Access Credentials</strong> on rule34.xxx and paste the whole box content above as-is.
    </footer>
  </section>

  <section id="main-view" hidden>
    <form id="find-uploader-form">
      <label class="field">
        No artist tag? Find who posted it
        <input type="text" id="postLookup" placeholder="Paste a post link or ID" autocomplete="off" />
      </label>
      <div class="job-actions">
        <button type="submit" id="find-uploader-btn" class="secondary">Find uploader</button>
        <button type="button" id="download-post-btn" class="secondary">Download this image</button>
      </div>
      <div id="uploader-result"></div>
    </form>

    <form id="job-form">
      <input type="text" id="tags" placeholder="Search tags" autocomplete="off" required />
      <a href="#" id="moreOptionsToggle">+ More options</a>
      <div id="moreOptions" hidden>
        <input type="text" id="excludeTags" placeholder="Exclude tags" autocomplete="off" />
        <input type="number" id="batchLimit" placeholder="Batch limit (optional)" autocomplete="off" min="1" />
      </div>
      <div class="options">
        <label><input type="checkbox" id="includeImages" checked /> Images</label>
        <label><input type="checkbox" id="includeVideos" checked /> Videos</label>
        <label><input type="checkbox" id="includeJson" checked /> JSON metadata</label>
        <label><input type="checkbox" id="filterAiPosts" /> Filter AI posts</label>
      </div>
      <div class="folder-row">
        <span id="folder-label"></span>
        <button type="button" class="secondary" id="scan-btn">Scan folder</button>
        <button type="button" class="secondary" id="change-folder">Change folder</button>
      </div>
      <div id="scan-result"></div>
      <div class="job-actions">
        <button type="button" class="secondary" id="search-btn">Search</button>
        <button type="button" class="secondary" id="queue-add-btn">Add to queue</button>
        <button type="submit" id="submit-btn">Download</button>
        <button type="button" class="secondary" id="cancel-btn" hidden>Cancel</button>
      </div>
    </form>

    <div id="queue-section" hidden>
      <div class="queue-header">
        <span>Queue</span>
        <button type="button" id="queue-start-btn">Start queue</button>
      </div>
      <ul id="queue-list"></ul>
    </div>

    <div id="search-result"></div>
    <div id="status"></div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <ul id="failures"></ul>
    <div id="preview"></div>

    <footer><a href="#" id="edit-key">Change API key</a></footer>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
